name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build knot
        run: ./scripts/build-knot

      - name: Stage npm packages
        run: node scripts/stage-npm.mjs

      - name: Stage platform packages
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          for dir in release/npm/knot-*; do
            (cd "$dir" && npm stage publish)
          done

      - name: Stage wrapper
        working-directory: release/npm/knot
        run: npm stage publish
