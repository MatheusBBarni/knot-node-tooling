name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned Bend
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          url="$(node -e 'const p=require("./toolchain.json"); process.stdout.write(p.bend.artifacts[process.argv[1]].url)' "$TARGET")"
          sha="$(node -e 'const p=require("./toolchain.json"); process.stdout.write(p.bend.artifacts[process.argv[1]].sha256)' "$TARGET")"
          curl -fsSL "$url" -o /tmp/bend.tar.gz
          printf '%s  %s\n' "$sha" /tmp/bend.tar.gz | shasum -a 256 -c -
          rm -rf "$HOME/.bend"
          mkdir -p "$HOME/.bend"
          tar -xzf /tmp/bend.tar.gz --strip-components=1 -C "$HOME/.bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bend/bin:$PATH"
          bend version

      - name: Build knot
        run: ./scripts/build-knot

      - name: Linux install and integrity gate
        if: matrix.target == 'linux-x64'
        env:
          KNOT: ${{ github.workspace }}/bin/knot
        run: |
          node --test \
            tests/acceptance/package-manager/install-one-package.test.mjs \
            tests/acceptance/package-manager/install-rejects-wrong-integrity.test.mjs \
            tests/acceptance/package-manager/install-rejects-missing-integrity.test.mjs

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knot-binary-${{ matrix.target }}
          path: dist/knot.bin
          if-no-files-found: error

  publish:
    needs: build-binaries
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download native binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: knot-binary-*
          path: release/binaries

      - name: Stage npm packages
        shell: bash
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import path from "node:path";
          import { stageNpmRelease } from "./scripts/stage-npm.mjs";

          stageNpmRelease({
            rootDir: process.cwd(),
            outDir: "release/npm",
            targets: [
              {
                platform: "darwin",
                arch: "arm64",
                libc: null,
                binaryPath: path.resolve("release/binaries/knot-binary-darwin-arm64/knot.bin"),
              },
              {
                platform: "linux",
                arch: "x64",
                libc: "glibc",
                binaryPath: path.resolve("release/binaries/knot-binary-linux-x64/knot.bin"),
              },
            ],
          });
          NODE
          node scripts/release-assets.mjs

      - name: Publish platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          publish_package() {
            dir="$1"
            name="$(node -p "require('./$dir/package.json').name")"
            error_file="$(mktemp)"
            if npm view "$name" name >/dev/null 2>"$error_file"; then
              (cd "$dir" && npm stage publish --access public)
            else
              if ! grep -Eq 'E404|404 Not Found' "$error_file"; then
                cat "$error_file"
                rm -f "$error_file"
                return 1
              fi
              (cd "$dir" && npm publish --access public)
            fi
            rm -f "$error_file"
          }
          for dir in release/npm/knot-*; do
            publish_package "$dir"
          done

      - name: Publish wrapper
        working-directory: release/npm/knot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          error_file="$(mktemp)"
          if npm view "$name" name >/dev/null 2>"$error_file"; then
            npm stage publish --access public
          else
            if ! grep -Eq 'E404|404 Not Found' "$error_file"; then
              cat "$error_file"
              rm -f "$error_file"
              exit 1
            fi
            npm publish --access public
          fi
          rm -f "$error_file"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/assets/*
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets
        run: |
          set -eu
          mapfile -t files < assets.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file NOTES.md \
              "${files[@]}"
          fi
